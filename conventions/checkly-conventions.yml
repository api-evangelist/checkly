    An agent cannot see how close it is to the ceiling until it hits it. See
    rate-limits/checkly-rate-limits.yml.
dry_run_mode:
  supported: partial
  grade: documented
  evidence: >-
    Not on the REST API. The Checkly CLI provides the rehearsal path, and the docs describe it in
    those words: `checkly test` "provides a dry-run capability for testing your monitoring setup
    before deployment" and runs checks without deploying them as monitors; `checkly test --list`
    enumerates without running; `checkly deploy --preview` shows the changes the deploy would make.
    Checkly's Agent Skills index also documents that CLI write commands exit with code 2 and a JSON
    confirmation envelope that an agent must explicitly confirm before the change is applied - a
    deliberate agent guardrail, and `--force` is what an operator passes to skip it in CI.
  commands:
  - checkly test
  - checkly test --list
  - checkly deploy --preview
  docs: https://www.checklyhq.com/docs/cli/checkly-test
reversibility:
  grade: documented
  applicable: true
  summary: >-
    Checkly publishes real reversal paths for its two in-flight operations (cancel a check session,
    cancel a test session) and a semantic reversal for incidents (resolve). What it does not publish
    anywhere is a WINDOW - no restore period after a delete, no undo horizon, no stated retention
    for a deleted check, dashboard, status page or incident. Deletes are documented as permanent and
    should be treated as unrecoverable.
  surfaces:
  - write: trigger a check session
    operationIds:
    - postV2ChecksessionsTrigger
    reversal: cancel the session
    reversal_operationId: postV1ChecksessionsChecksessionidCancel
    window: >-
      Only while the session is running - the operation exists to stop an in-flight run. No duration
      is stated in the docs or the contract.
    window_stated: false
    docs: https://www.checklyhq.com/docs/api-reference/overview/
  - write: trigger a test session
    operationIds:
    - postV1TestsessionsTrigger
    reversal: cancel the session
    reversal_operationId: postV1TestsessionsTestsessionidCancel
    window: While the session is in progress. No duration stated.
    window_stated: false
  - write: create a status page incident
    operationIds:
    - createStatusPageV3IncidentPublic
    reversal: resolve the incident, or delete it
    reversal_operationId: deleteStatusPageV3IncidentPublic
    window: >-
      No window stated. Resolving posts a final update and leaves the record; deleting is documented
      in the v1 equivalent as "Permanently removes an incident and all its updates".
    window_stated: false
    caution: >-
      Incident creates and updates can notify subscribers. A notification that has gone out cannot be
      recalled by deleting the incident, so this write is only partially reversible in effect.
  - write: create or update an account environment variable
    operationIds:
    - postV1Variables
    - putV1VariablesKey
    reversal: overwrite with the prior value, or delete the key
    reversal_operationId: deleteV1VariablesKey
    window: No window. There is no version history on variables and secret values are never echoed back.
    window_stated: false
    caution: >-
      Overwriting a secret is destructive - the previous value cannot be read back before or after
      the write, so an agent cannot restore it.
  - write: delete a check, check group, dashboard, snippet, private location, maintenance window,
      client certificate, status page or alert channel
    operationIds:
    - deleteV1ChecksId
    - deleteV1CheckgroupsId
    - deleteV1DashboardsDashboardid
    - deleteV1SnippetsId
    - deleteV1PrivatelocationsId
    - deleteV1MaintenancewindowsId
    - deleteV1ClientcertificatesId
    - deleteStatusPageV3Public
    - deleteV1AlertchannelsId
    reversal: none published
    window: none
    window_stated: false
    mitigation: >-
      This is precisely what monitoring-as-code buys: a resource deleted through the API can be
      re-created from the versioned project with `checkly deploy`. That is a recovery path in the
      customer's git history, not a restore feature of the API. The CLI also ships one real
      soft-delete: `checkly deploy --preserve-resources` detaches resources removed from code,
      keeping them and their run history instead of deleting them.
  no_invented_windows: >-
    No retention or restore window is asserted here because Checkly publishes none. Any number in
    this block would be a guess with real consequences.
