  note: No expand, include or fields parameter anywhere in the contract.
metadata:
  mechanism: tags
  note: >-
    Checks carry a free-form tags array, and Checkly's webhook templating exposes a tagValue helper
    that reads key:value or key=value metadata out of it. Tags are the de-facto metadata store.
