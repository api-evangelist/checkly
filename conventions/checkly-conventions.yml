source: >-
  https://www.checklyhq.com/docs/api-reference/overview (HTTP 200),
  https://www.checklyhq.com/docs/admin/creating-api-key (HTTP 200),
  https://www.checklyhq.com/docs/ai/mcp-server/tools (HTTP 200), a live unauthenticated request to
  https://api.checklyhq.com/v1/checks (HTTP 401, headers captured), and
  openapi/_original/checkly-public-api-openapi.json harvested 2026-08-29.
description: >-
  Cross-cutting runtime semantics for the Checkly Public API: how to authenticate, page, retry, and
  above all whether a write can be taken back. Checkly's own guidance is that resources should be
  managed as code through the CLI, Terraform or Pulumi rather than by direct API writes, and that
  posture shows in the conventions - there is no idempotency machinery on the REST surface.
authentication:
  style: bearer-api-key
  header: 'Authorization: Bearer <api key>'
  account_selector: 'X-Checkly-Account: <account id>'
  note: >-
    Both headers are required. The account header is not an OpenAPI securityScheme in the current
    contract - it is documented in the API reference and in the scheme description - so a generated
    client built from the spec alone will 401 until the account header is added by hand.
  key_types:
  - user API key
  - service API key
  docs: https://www.checklyhq.com/docs/admin/creating-api-key
  oauth:
    rest: false
    mcp: true
    note: OAuth 2.1 with 14 scopes exists, but only on the MCP endpoint. See scopes/checkly-scopes.yml.
idempotency:
  supported: false
  header: null
  evidence: >-
    The harvested contract contains zero occurrences of 'Idempotency' or 'idempotency-key' across
    225 operations, and no docs page describes one. Checkly's MCP tool reference goes the other way
    and labels its write tools explicitly - invite-account-member, create-status-page-incident,
    update-status-page-incident and resolve-status-page-incident are each documented as "Not
    idempotent".
  consequence: >-
    A retried POST after a timeout can create a second incident, a second incident update, or a
    second invite. An agent must read-back before retrying any write.
  mitigation: >-
    Most write surfaces are key-addressed rather than id-addressed for the resources agents touch
    most - environment variables are PUT /v1/variables/{key}, which is naturally idempotent, and
    check configuration is meant to be applied declaratively through `checkly deploy`.
pagination:
  styles:
  - style: page-number
    params:
    - limit
    - page
    used_by: 42 operations declare limit, 29 declare page
    note: 1-based page numbers. The MCP list-check-stats tool documents a default page size of 25 and a maximum of 100.
  - style: cursor
    params:
    - nextId
    used_by: 12 operations
    note: Used on the higher-volume result and session listings.
  response_metadata:
    fields:
    - length
    - total
    - page
    - limit
    - totalPages
    - filters
    note: >-
      Documented for the MCP tool responses; the REST listings return the collection directly and
      pagination metadata varies by endpoint rather than following one envelope.
  time_windows:
    params:
    - from
    - to
    - quickRange
    note: Analytics and result endpoints take an explicit window or a named quick range such as last24Hours.
filtering:
  common_params:
