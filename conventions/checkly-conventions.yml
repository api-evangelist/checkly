  documented_limit: 600 requests per 60 seconds on most routes
  headers_documented: false
  headers_observed: false
  status_on_exhaustion: 429
  note: >-
    429 is declared on 223 of 225 operations, but no X-RateLimit-*, RateLimit-* or Retry-After header
