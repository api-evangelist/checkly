tool_count: 32
counts:
  read: 24
  write: 8
notes:
- >-
  Tools are surfaced conditionally - the docs state each tool appears only when the MCP session
  holds the matching permission, and some write tools additionally require an Admin or Read & Write
  account role. A tool list from an authenticated session will therefore be a subset of this one.
- >-
  Checkly documents the division of labour explicitly - MCP for live account state and actions,
  Agent Skills plus the CLI for authoring, testing and deploying check code.
