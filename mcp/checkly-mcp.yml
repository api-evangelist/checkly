  description: Get one account-level variable by key; secret values return as null.
- name: create-account-environment-variable
  category: environment-variables
  type: write
  description: Create an account-level variable or secret; secret values are encrypted and never echoed back.
- name: update-account-environment-variable
  category: environment-variables
  type: write
  description: Update an account-level variable or secret by key.
- name: list-status-pages
  category: status-pages
  type: read
  description: List status pages including the cards and services needed for incident targeting.
- name: get-status-page
  category: status-pages
  type: read
  description: Get one status page with cards and services.
- name: list-status-page-incidents
  category: incidents
