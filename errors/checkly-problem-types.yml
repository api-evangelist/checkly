description: Error catalog for the Checkly Public API. Checkly uses a consistent hand-rolled JSON envelope
  on every error, not RFC 9457 problem+json.
format: custom-json
rfc9457: false
content_type: application/json
envelope:
  shape:
    statusCode: number, equal to the HTTP status
    error: string, the HTTP reason phrase
    message: string, human readable
    attributes: object, present on some 401/402/429 responses
  required:
  - statusCode
  - error
  example:
    statusCode: 401
    error: Unauthorized
    message: Missing authentication
  example_source: live response from GET https://api.checklyhq.com/v1/checks with no credentials, 2026-08-29
  note: There is no machine-readable error code beyond the HTTP status - no 'code' or 'type' discriminator
    - so an agent branching on failure has only the status and free-text message to work with.
