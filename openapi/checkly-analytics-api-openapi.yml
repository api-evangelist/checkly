openapi: 3.2.0
info:
  title: Checkly Public Analytics API
  version: v1
  description: These are the docs for the newly released Checkly Public API.<br />If you have any questions, please do not hesitate to get in touch with us.
servers:
- url: https://api.checklyhq.com
security:
- Bearer: []
tags:
- name: Analytics
paths:
  /v1/analytics/api-checks/{id}:
    get:
      summary: API checks
      operationId: getV1AnalyticsApichecksId
      description: Fetch detailed availability metrics and aggregated or non-aggregated API Check metrics across custom time ranges. For example, you can get the p99 and p95 of all the DNS phases of your API check together with the availability percentage for any time range.<br><br><b>Rate-limiting is applied to this endpoint, you can send 30 requests / 60 seconds at most.<b>
      tags:
      - Analytics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsApiCheckResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - schema:
          type: string
          minLength: 1
          format: uuid
        required: true
        name: id
        in: path
      - schema:
          type: string
          format: date
          description: Custom start time of reporting window in unix timestamp format. Setting a custom "from" timestamp overrides the use of any "quickRange".
        required: false
        description: Custom start time of reporting window in unix timestamp format. Setting a custom "from" timestamp overrides the use of any "quickRange".
        name: from
        in: query
      - schema:
          type: string
          format: date
          description: Custom end time of reporting window in unix timestamp format. Setting a custom "to" timestamp overrides the use of any "quickRange".
        required: false
        description: Custom end time of reporting window in unix timestamp format. Setting a custom "to" timestamp overrides the use of any "quickRange".
        name: to
        in: query
      - schema:
          type: string
          enum:
          - last24Hours
          - last7Days
          - last30Days
          - thisWeek
          - thisMonth
          - lastWeek
          - lastMonth
          default: last24Hours
          description: Preset reporting windows are used for quickly generating report on commonly used windows. Can be overridden by using a custom "to" and "from" timestamp.
        required: false
        description: Preset reporting windows are used for quickly generating report on commonly used windows. Can be overridden by using a custom "to" and "from" timestamp.
        name: quickRange
        in: query
      - schema:
          type: number
          minimum: 1
          maximum: 43200
          example: 1440
          description: The time interval to use for aggregating metrics in minutes. For example, five minutes is 5, 24 hours is 1440.
        required: false
        description: The time interval to use for aggregating metrics in minutes. For example, five minutes is 5, 24 hours is 1440.
        name: aggregationInterval
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - success
            - failure
          example:
          - failure
          description: Filter based on whether a check result was either failing or passing
        required: false
        description: Filter based on whether a check result was either failing or passing
        name: filterByStatus
        in: query
      - schema:
          type: string
          enum:
          - runLocation
          - statusCode
          description: Determines how the series data is grouped. Note that grouped queries are a bit more expensive and might take longer.
        required: false
        description: Determines how the series data is grouped. Note that grouped queries are a bit more expensive and might take longer.
        name: groupBy
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - responseTime
            - wait
            - dns
            - tcp
            - firstByte
            - download
            - availability
            - retries
            - responseTime_avg
            - responseTime_max
            - responseTime_median
            - responseTime_min
            - responseTime_p50
            - responseTime_p90
            - responseTime_p95
            - responseTime_p99
            - responseTime_stddev
            - responseTime_sum
            - wait_avg
            - wait_max
            - wait_median
            - wait_min
            - wait_p50
            - wait_p90
            - wait_p95
            - wait_p99
            - wait_stddev
            - wait_sum
            - dns_avg
            - dns_max
            - dns_median
            - dns_min
            - dns_p50
            - dns_p90
            - dns_p95
            - dns_p99
            - dns_stddev
            - dns_sum
            - tcp_avg
            - tcp_max
            - tcp_median
            - tcp_min
            - tcp_p50
            - tcp_p90
            - tcp_p95
            - tcp_p99
            - tcp_stddev
            - tcp_sum
            - firstByte_avg
            - firstByte_max
            - firstByte_median
            - firstByte_min
            - firstByte_p50
            - firstByte_p90
            - firstByte_p95
            - firstByte_p99
            - firstByte_stddev
            - firstByte_sum
            - download_avg
            - download_max
            - download_median
            - download_min
            - download_p50
            - download_p90
            - download_p95
            - download_p99
            - download_stddev
            - download_sum
          description: Available metrics for API Checks. You can pass multiple metrics as a comma separated string.
        required: true
        description: Available metrics for API Checks. You can pass multiple metrics as a comma separated string.
        name: metrics
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Limit the number of results
        required: false
        description: Limit the number of results
        name: limit
        in: query
      - schema:
          type: number
          default: 1
          description: Page number
          exclusiveMinimum: 0
        required: false
        description: Page number
        name: page
        in: query
      - schema:
          type: string
          format: uuid
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
