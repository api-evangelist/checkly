components:
  schemas:
    attributes:
      type: object
    AccountMembersList:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/AccountMembersListItems'
        length:
          type: integer
          minimum: 0
          description: Number of items returned in this page. This is not the total matching count.
        nextId:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page. Null means there are no more results.
      required:
      - members
      - length
      - nextId
    Account:
      type: object
      properties:
        id:
          type: string
          x-format:
            guid: true
          description: Checkly account ID.
          example: d43967ee-81db-4e0b-a18c-06be5c995288
        name:
          type: string
          description: The name of the account.
          example: Checkly
        runtimeId:
          type: string
          description: The account default runtime ID.
          example: '2022.10'
        plan:
          type: string
          description: The account plan type.
          example: team
        planDisplayName:
          type: string
          description: The human-readable display name of the account plan.
          example: Team
        addons:
          $ref: '#/components/schemas/AccountAddons'
        settings:
          $ref: '#/components/schemas/AccountSettings'
        alertSettings:
          $ref: '#/components/schemas/AccountAlertSettings'
        features:
          type: array
          items:
            type: string
          description: Client-visible account feature flags.
          example:
          - EXTENDED_RESPONSE_TIME_LIMITS
      required:
      - id
    AccountSettings:
      type: object
      properties: {}
      additionalProperties: true
      description: The settings of the account.
    AccountEntitlementLocation:
      type: object
      properties:
        id:
          type: string
          description: Location identifier (e.g. us-east-1).
        name:
          type: string
          description: Human-readable location name (e.g. N. Virginia).
        available:
          type: boolean
          description: Whether this location is available on the current plan.
      required:
      - id
      - name
      - available
    Model2:
      type: string
      enum:
      - Too Many Requests
    TooManyRequestsError:
      type: object
      properties:
        statusCode:
          type: number
          enum:
          - 429
        error:
          $ref: '#/components/schemas/Model2'
        message:
          type: string
          example: Too Many Requests
        attributes:
          $ref: '#/components/schemas/attributes'
      required:
      - statusCode
      - error
    UnauthorizedError:
      type: object
      properties:
        statusCode:
          type: number
          enum:
          - 401
        error:
          $ref: '#/components/schemas/error'
        message:
          type: string
          example: Bad Token
        attributes:
          $ref: '#/components/schemas/attributes'
      required:
      - statusCode
      - error
    AccountRequiredAddon:
      type: object
      properties:
        name:
          type: string
          description: The addon name.
        displayName:
          type: string
          description: Human-readable addon name.
        tier:
          type: string
          enum:
          - hobby
          - starter
          - team
          description: The minimum addon tier required (e.g. starter, team).
        tierDisplayName:
          type: string
          description: Human-readable addon tier name.
      required:
      - name
      - displayName
      - tier
      - tierDisplayName
      description: The addon and tier required to unlock this entitlement. Only present for disabled entitlements.
    Entitlements:
      type: object
      properties:
        plan:
          type: string
          description: The account plan type.
          example: team
        planDisplayName:
          type: string
          description: The human-readable display name of the account plan.
          example: Team
        addons:
          $ref: '#/components/schemas/AccountAddons'
        locations:
          $ref: '#/components/schemas/AccountEntitlementLocations'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/AccountEntitlement'
          description: List of entitled features for this account.
      required:
      - plan
      - locations
      - entitlements
    AccountAlertSettings:
      type: object
      properties: {}
      additionalProperties: true
      description: The alert settings of the account.
    AccountEntitlement:
      type: object
      properties:
        key:
          type: string
          description: Unique entitlement identifier.
        name:
          type: string
          description: Human-friendly display name.
        description:
          type: string
          description: Short description of what this entitlement controls.
        type:
          type: string
          enum:
          - flag
          - metered
          description: Whether this entitlement is a boolean feature flag or a metered resource with a quantity limit.
        enabled:
          type: boolean
          description: Whether this entitlement is available on the current plan.
        quantity:
          type: integer
          minimum: 0
          description: Maximum allowed quantity. Only present for metered entitlements.
        requiredPlan:
          type: string
          description: The minimum plan required to unlock this entitlement. Only present for disabled entitlements.
        requiredPlanDisplayName:
          type: string
          description: Human-readable name of the required plan.
        requiredAddon:
          $ref: '#/components/schemas/AccountRequiredAddon'
      required:
      - key
      - name
      - description
      - type
      - enabled
    AccountEntitlementLocations:
      type: object
      properties:
        all:
          type: array
          items:
            $ref: '#/components/schemas/AccountEntitlementLocation'
          description: All Checkly locations with availability for this account.
        maxPerCheck:
          type: integer
          minimum: 1
          description: Maximum locations selectable per check. Absent when unlimited.
      required:
      - all
      description: Check run locations and limits for this account.
    AccountMember:
      type: object
      properties:
        type:
          type: string
          enum:
          - member
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - READ_WRITE
          - READ_RUN
          - READ_ONLY
        status:
          type: string
          enum:
          - ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isSupportMembership:
          type: boolean
        ssoEnabled:
          type: boolean
        mfaEnabled:
          type: boolean
      required:
      - type
      - accountId
      - userId
      - name
      - email
      - role
      - status
      - createdAt
      - updatedAt
      - isSupportMembership
      - ssoEnabled
      - mfaEnabled
    AccountAddonTier:
      type: object
      properties:
        tier:
          type: string
          enum:
          - hobby
          - starter
          - team
          description: The add-on tier.
          example: starter
        tierDisplayName:
          type: string
          description: The human-readable display name of the add-on tier.
          example: Communicate Starter
    AccountMembersListItems:
      oneOf:
      - $ref: '#/components/schemas/AccountMember'
      - $ref: '#/components/schemas/AccountInvite'
      discriminator:
        propertyName: type
        mapping:
          member: '#/components/schemas/AccountMember'
          invite: '#/components/schemas/AccountInvite'
    AccountMemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - READ_WRITE
          - READ_RUN
          - READ_ONLY
          description: New account member role. OWNER is not supported.
      required:
      - role
      additionalProperties: false
    ForbiddenError:
      type: object
      properties:
        statusCode:
          type: number
          enum:
          - 403
        error:
          $ref: '#/components/schemas/Model1'
        message:
          type: string
          example: Forbidden
      required:
      - statusCode
      - error
    ApiError:
      type: object
      properties:
        statusCode:
          type: number
        error:
          type: string
        message:
          type: string
      required:
      - statusCode
      - error
      - message
    AccountList:
      type: array
      items:
        $ref: '#/components/schemas/Account'
    NotFoundError:
      type: object
      properties:
        statusCode:
          type: number
          enum:
          - 404
        error:
          $ref: '#/components/schemas/Model4'
        message:
          type: string
          example: Not Found
      required:
      - statusCode
      - error
    error:
      type: string
      enum:
      - Unauthorized
    Model4:
      type: string
      enum:
      - Not Found
    Model1:
      type: string
      enum:
      - Forbidden
    AccountInvite:
      type: object
      properties:
        type:
          type: string
          enum:
          - invite
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - ADMIN
          - READ_WRITE
          - READ_RUN
          - READ_ONLY
        status:
          type: string
          enum:
          - PENDING
          - EXPIRED
        inviterEmail:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required:
      - type
      - id
      - accountId
      - email
      - role
      - status
      - inviterEmail
      - createdAt
      - updatedAt
      - expiresAt
    AccountAddons:
      type: object
      properties:
        communicate:
          $ref: '#/components/schemas/AccountAddonTier'
        resolve:
          $ref: '#/components/schemas/AccountAddonTier'
      description: The add-ons available to the account.
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: Bearer
      description: 'The Checkly Public API uses API keys to authenticate requests. You can get the API Key <a href="https://app.checklyhq.com/settings/user/api-keys" target="_blank">here</a>.</br>Your API key is like a password: <br>keep it secure!</br></br>Authentication to the API is performed using the Bearer auth method in the Authorization header and using the account ID.</br></br>For example, set <b>Authorization</b> header while using cURL: <code>curl -H "Authorization: Bearer [apiKey]" "X-Checkly-Account: [accountId]"</code></br>'
