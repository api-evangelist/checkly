openapi: 3.2.0
info:
  title: Checkly Public Accounts API
  version: v1
  description: These are the docs for the newly released Checkly Public API.<br />If you have any questions, please do not hesitate to get in touch with us.
servers:
- url: https://api.checklyhq.com
security:
- Bearer: []
tags:
- name: Accounts
paths:
  /v1/accounts:
    get:
      summary: Fetch user accounts
      operationId: getV1Accounts
      description: List account details based on supplied API key.
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
      parameters:
      - schema:
          type: string
          x-format:
            guid: true
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/me:
    get:
      summary: Fetch current account details
      operationId: getV1AccountsMe
      description: Get details from the current account.
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
      parameters:
      - schema:
          type: string
          x-format:
            guid: true
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/me/entitlements:
    get:
      summary: Fetch current account entitlements
      operationId: getV1AccountsMeEntitlements
      description: Fetch the entitlements for the account, including feature access and limits based on the current plan.
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
      parameters:
      - schema:
          type: string
          x-format:
            guid: true
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/me/members:
    get:
      summary: List current account members and pending invites
      operationId: getV1AccountsMeMembers
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMembersList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - schema:
          type: string
          description: Case-insensitive partial match against member name, member email, and invite email. Empty searches are ignored.
        required: false
        description: Case-insensitive partial match against member name, member email, and invite email. Empty searches are ignored.
        name: search
        in: query
      - schema:
          type: string
          enum:
          - member
          - invite
          description: Filter by account member list item type.
        required: false
        description: Filter by account member list item type.
        name: type
        in: query
      - schema:
          type: string
          enum:
          - OWNER
          - ADMIN
          - READ_WRITE
          - READ_RUN
          - READ_ONLY
          description: Filter by account role. Valid filters may produce no results for invites.
        required: false
        description: Filter by account role. Valid filters may produce no results for invites.
        name: role
        in: query
      - schema:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - EXPIRED
          description: Filter by member or invite status. Valid filters may produce no results for some item types.
        required: false
        description: Filter by member or invite status. Valid filters may produce no results for some item types.
        name: status
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Page length. Omitted returns all matching members and invites.
        required: false
        description: Page length. Omitted returns all matching members and invites.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque cursor returned from a previous limited request. Only accepted with limit and the same query params.
        required: false
        description: Opaque cursor returned from a previous limited request. Only accepted with limit and the same query params.
        name: nextId
        in: query
      - schema:
          type: string
          format: uuid
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/me/members/{userId}:
    delete:
      summary: Remove a current account member
      operationId: deleteV1AccountsMeMembersUserid
      tags:
      - Accounts
      responses:
        '204':
          description: Member removed.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: userId
        in: path
      - schema:
          type: string
          format: uuid
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
    patch:
      summary: Update a current account member role
      operationId: patchV1AccountsMeMembersUserid
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMember'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: userId
        in: path
      - schema:
          type: string
          format: uuid
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMemberUpdate'
  /v1/accounts/{accountId}:
    get:
      summary: Fetch a given account details
      operationId: getV1AccountsAccountid
      description: Get details from a specific account.
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
      parameters:
      - schema:
          type: string
          x-format:
            guid: true
        required: true
        name: accountId
        in: path
      - schema:
          type: string
          x-format:
            guid: true
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/{accountId}/entitlements:
    get:
      summary: Fetch account entitlements
      operationId: getV1AccountsAccountidEntitlements
      description: Fetch the entitlements for the account, including feature access and limits based on the current plan.
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
      parameters:
      - schema:
          type: string
          x-format:
            guid: true
        required: true
        name: accountId
        in: path
      - schema:
          type: string
          x-format:
            guid: true
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/{accountId}/members:
    get:
      summary: List account members and pending invites
      operationId: getV1AccountsAccountidMembers
      tags:
      - Accounts
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMembersList'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: accountId
        in: path
      - schema:
          type: string
          description: Case-insensitive partial match against member name, member email, and invite email. Empty searches are ignored.
        required: false
        description: Case-insensitive partial match against member name, member email, and invite email. Empty searches are ignored.
        name: search
        in: query
      - schema:
          type: string
          enum:
          - member
          - invite
          description: Filter by account member list item type.
        required: false
        description: Filter by account member list item type.
        name: type
        in: query
      - schema:
          type: string
          enum:
          - OWNER
          - ADMIN
          - READ_WRITE
          - READ_RUN
          - READ_ONLY
          description: Filter by account role. Valid filters may produce no results for invites.
        required: false
        description: Filter by account role. Valid filters may produce no results for invites.
        name: role
        in: query
      - schema:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - EXPIRED
          description: Filter by member or invite status. Valid filters may produce no results for some item types.
        required: false
        description: Filter by member or invite status. Valid filters may produce no results for some item types.
        name: status
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Page length. Omitted returns all matching members and invites.
        required: false
        description: Page length. Omitted returns all matching members and invites.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque cursor returned from a previous limited request. Only accepted with limit and the same query params.
        required: false
        description: Opaque cursor returned from a previous limited request. Only accepted with limit and the same query params.
        name: nextId
        in: query
      - schema:
          type: string
          format: uuid
          description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        required: false
        description: Your Checkly account ID, you can find it at https://app.checklyhq.com/settings/account/general
        name: x-checkly-account
        in: header
  /v1/accounts/{accountId}/members/{userId}:
    delete:
      summary: Remove an account member
      operationId: deleteV1AccountsAccountidMembersUserid
      tags:
      - Accounts
      responses:
        '204':
          description: Member removed.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
