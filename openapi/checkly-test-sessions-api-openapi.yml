                type: array
                items:
                  type: string
                  enum:
                  - NETWORK_ERROR
              type:
                type: string
                enum:
                - FIXED
                - LINEAR
                - EXPONENTIAL
              maxRetries:
                type: number
                minimum: 1
                maximum: 10
                default: 2
              maxDurationSeconds:
                type: number
                minimum: 0
                maximum: 600
                default: 600
