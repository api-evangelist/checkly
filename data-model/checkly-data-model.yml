description: >-
  The Checkly entity graph, derived from the OpenAPI path hierarchy and the id-reference fields on
  its component schemas. The graph has one spine - an Account owns Checks, a Check produces Results,
  a Result belongs to a Session and rolls up into an Error Group, and an Error Group is what Rocky AI
  analyses - plus two satellite domains, alerting and status pages, that hang off the same account.
identity:
  primary_key: UUID on every top-level resource
  account_scoping: >-
    Every request is scoped to one account by the X-Checkly-Account header, so ids are only unique
    within an account context. A correct id against the wrong account returns 404, not 403.
  logical_id: >-
    Resources created through the CLI carry a logicalId (17 schemas) - the stable, human-authored key
    that lets monitoring-as-code reconcile a local construct with a remote resource across deploys.
    It is the closest thing Checkly has to an external identifier.
  id_prefixes: none - Checkly uses bare UUIDs, with no typed prefix scheme
