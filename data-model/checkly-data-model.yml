notes:
- >-
  The polymorphic Check is the modelling decision that shapes everything else: one entity, ten
  request/assertion shapes, and a separate create/update path per type (/v1/checks/api,
  /v1/checks/browser, /v1/checks/url, /v1/checks/ssl, ...). The generic POST /v1/checks and
  PUT /v1/checks/{id} are deprecated precisely because they could not express that.
- >-
  Naming in the schema layer is versioned and namespaced - ChecksV1UrlMonitorUpdate,
  IncidentUpdateV1Response - which makes the 629 schemas navigable but means a v1 and a v3 model of
  the same concept coexist under different names.
