domain_standards:
  market: synthetic monitoring / observability
  assessment: >-
    Observability has real interchange standards - OpenTelemetry, OTLP, Prometheus exposition,
    W3C Trace Context - and Checkly speaks them on the ingest and export side of its product. What
    the Public API does NOT do is declare one in its own contract: there is no OTLP endpoint, no
    Prometheus /metrics surface and no W3C traceparent handling described in the 225 operations. The
    contract is a bespoke management API for a monitoring product, which is the norm in this market
    rather than a deficiency.
  declared_in_contract: false
  reward_only: >-
    No domain-standard conformance is asserted for the API contract because none is declared in it.
    This is not scored against Checkly.
