aid: checkly
name: Checkly
description: >-
  Checkly is a code-first reliability platform for synthetic monitoring, uptime monitoring, alerting
  and AI-assisted incident investigation. Engineering teams define monitors as versioned code with
  the Checkly CLI, Terraform or Pulumi, reuse existing Playwright suites as production browser
  checks, and run them from 22 global locations or from private locations inside their own network.
  The platform spans three modules: Detect (uptime, API and browser monitoring), Communicate
  (alerting, status pages and dashboards) and Resolve (OpenTelemetry tracing and Rocky AI root cause
  analysis). Checkly exposes a 225-operation public REST API, a hosted MCP server, four published
  Agent Skills and machine-readable llms.txt, docs and pricing.
type: Index
