method: searched
source: >-
  https://www.checklyhq.com/docs/cli/overview (HTTP 200), the per-command docs index at
  https://www.checklyhq.com/docs/llms.txt, https://www.checklyhq.com/docs/cli/checkly-test (HTTP 200),
  https://www.checklyhq.com/docs/cli/checkly-deploy (HTTP 200), and registry.npmjs.org/checkly.
description: >-
  The Checkly CLI is the primary interface to Checkly, not a convenience wrapper on the API. Checkly
  routes both humans and agents to it for anything that creates or changes a monitor - its own API
  reference tells you to prefer the CLI over direct API writes, and its MCP server refuses that work
  on purpose because it runs remotely and cannot see a local project.
name: checkly
package: checkly
registry: npm
url: https://www.npmjs.com/package/checkly
repository: https://github.com/checkly/checkly-cli
version: 8.23.2
published: '2026-08-28'
documentation: https://www.checklyhq.com/docs/cli/overview/
install:
- method: npm global
  command: npm install -g checkly
- method: npx
  command: npx checkly <command>
- method: scaffold
  command: npm create checkly@latest
  note: Uses the create-checkly package.
project_model:
  config_file: checkly.config.ts or checkly.config.js
  language: TypeScript / JavaScript constructs
  note: >-
    Monitoring is declared as code in constructs (UrlMonitor, DnsMonitor, TcpMonitor, IcmpMonitor,
    SslMonitor, GrpcMonitor, TracerouteMonitor, HeartbeatMonitor, ApiCheck, MultistepCheck,
    BrowserCheck, PlaywrightCheckSuite, alert channels, dashboards, status pages) and reconciled
    with the account on deploy.
commands:
- group: session
  commands:
  - {name: login, description: Sign up for a new Checkly account or log in to an existing one.}
  - {name: logout, description: Log out of your Checkly account.}
  - {name: whoami, description: Display current account and user information.}
  - {name: switch, description: Switch between multiple Checkly accounts.}
  - {name: account, description: View account plan, entitlements, feature limits and available locations.}
  - {name: members, description: List, update and delete members in your Checkly account.}
- group: authoring and deployment
  commands:
