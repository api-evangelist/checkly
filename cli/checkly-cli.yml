command_count: 24
key_flows:
- name: Scaffold and first deploy
  steps:
  - npm create checkly@latest
  - npx checkly login
  - npx checkly test
  - npx checkly deploy
- name: Rehearse before changing production monitoring
  steps:
  - npx checkly test --list
  - npx checkly deploy --preview
  - npx checkly deploy
- name: Investigate a failure from the terminal
  steps:
  - npx checkly checks
  - npx checkly test-sessions
  - npx checkly assets
  - npx checkly rca
agent_safety:
  confirmation_envelope: >-
    Checkly's published Agent Skills index states that CLI write commands (create, update, resolve,
    deploy) exit with code 2 and a JSON confirmation envelope that an agent must explicitly confirm
    before the change is applied. `--force` skips the dialog, which is the documented CI path.
  preserve_resources: >-
    `checkly deploy --preserve-resources` detaches resources removed from code, keeping them and
    their run history, instead of deleting them.
  source: https://www.checklyhq.com/.well-known/agent-skills/index.json
notes:
- >-
  Checkly's API reference explicitly recommends the CLI over the REST API for creating and updating
  resources - unusual candour for a provider that also publishes a 225-operation OpenAPI.
- Terraform and Pulumi providers cover the same declarative ground; see packages/checkly-packages.yml.
