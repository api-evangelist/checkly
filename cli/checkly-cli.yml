  - {name: test, description: Run checks in your project as a dry run without deploying them as monitors.}
  - {name: deploy, description: Deploy checks and resources to your Checkly account.}
  - {name: destroy, description: Destroy all project resources from your Checkly account.}
  - {name: import, description: Import existing resources into your CLI-managed project.}
  - {name: sync-playwright, description: Synchronize Playwright configuration with Checkly settings.}
  - {name: pw-test, description: Run Playwright tests with Checkly monitoring features.}
- group: operations
  commands:
  - {name: checks, description: List, inspect, run and analyze checks in your account.}
  - {name: trigger, description: Trigger checks already in your Checkly account.}
  - {name: test-sessions, description: Inspect recorded test sessions and their error groups.}
  - {name: assets, description: List and download result assets such as logs, traces, videos and screenshots.}
