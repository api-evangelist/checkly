  name: Detect
  covers: Uptime monitoring and synthetic monitoring (browser + API checks)
- id: communicate
  name: Communicate
  covers: Status pages and dashboards
- id: resolve
  name: Resolve
  covers: AI-powered root cause analysis (Rocky AI)
