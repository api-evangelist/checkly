supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file, whose Free/Professional/
  Enterprise tiers and per-request quotas were template defaults and bore no relation to Checkly's
  actual plans.
description: >-
  Checkly's published plans, read from https://www.checklyhq.com/pricing.md - a machine-readable
  markdown pricing document Checkly maintains alongside its pricing page and links from its llms.txt
  specifically so an agent can quote a price. Pricing is modular: four tiers priced independently
  across three product modules (Detect, Communicate, Resolve), plus resource add-ons and overage
  rates on Detect. Annual billing saves roughly 20%. Nothing here is metered on API requests -
  Checkly meters monitors and check runs, and the REST API is free to call within its rate limit.
currency: USD
billing_periods:
- monthly
- annual
