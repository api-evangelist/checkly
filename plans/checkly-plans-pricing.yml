plan_count: 4
api_metering:
  metered_on_api_calls: false
  note: >-
    No plan meters REST API requests. What the plans meter is product consumption - monitors, browser
    and API check runs, RCA invocations, SMS and phone alerts. The API itself is bounded by the rate
    limit (600 requests / 60 seconds), not by a plan quota, and a 402 PaymentRequiredError is how the
    API reports that a write would exceed a plan entitlement rather than a request quota.
agent_readable_pricing:
  url: https://www.checklyhq.com/pricing.md
  status: 200
  note: >-
    Worth calling out: Checkly publishes a markdown twin of its pricing page, linked from llms.txt,
    that includes a step-by-step "How to Use This Document" quoting procedure written for an agent.
    Very few providers in the catalog publish machine-readable pricing at all.
